method(){return `<div class="wrap"><h1 style="font-size:46px;margin:34px 0 20px">Method</h1><div class="two"><section><h3 style="font-size:28px;margin-bottom:10px">Capital Retention Score</h3><p class="mut">CRS = Technical × 0.4 + Ecological × 0.3 + Economic × 0.3, scaled to a percentage. Each material is checked against 18 criteria: six technical, six ecological, six economic. Each capital is scored as the share of its six criteria that are ticked, then weighted. Every inventory score in this app is calculated that way, which corrects several printed values.</p><h3 style="font-size:28px;margin:26px 0 10px">Deterioration trajectory</h3><p class="mut">Dt = (CRS₀ − CRS₁) ÷ (t₁ − t₀), where CRS₀ is the earlier score and CRS₁ the later one. A positive Dt is value lost per year, in percentage points. The threshold year is t₁ + (CRS₁ − 60) ÷ Dt.</p><h3 style="font-size:28px;margin:26px 0 10px">The lenses</h3><p class="mut">Researcher and ecologist weights are applied to the same 18 ticks. The weights are this app's own proposal and need justifying before they are defended.</p><h3 style="font-size:28px;margin:26px 0 10px">The glyph</h3><p class="mut">Each circle is drawn from the component's ticks: wedges for structure, stripes for skin, rings for services, dots for the space plan.</p></section><section><h3 style="font-size:28px;margin-bottom:12px">The loop</h3><ol class="steps">${[["Assess","What is happening now?"],["Classify","Which shearing layer is it in?"],["Value","What capital remains? (CRS)"],["Project","How is it changing?"],["Relate","What does it affect, and what affects it?"],["Decide","Which option retains the most capital?"],["Intervene","Do the work."],["Register","What actually happened?"],["Reassess","New CRS, and the loop repeats."]].map(s=>`<li><span><b style="font-weight:500">${s[0]}.</b> <span class="mut">${s[1]}</span></span></li>`).join("")}</ol></section></div><div style="height:60px"></div></div>`},

mat(){const c=C(),T=[["record","Record"],["assess","Assess"],["project","Project"],["decide","Decide"]],crumb=`<div class="crumb mono"><button data-a="go" data-p="index">Index</button> / ${c.layer} / ${c.id}</div>`;
 const head=`<div class="wrap">${crumb}<div class="mh"><h1>${esc(c.name)}</h1><button class="btn p" data-a="card">Identity card</button></div><div class="tabs">${T.map(t=>`<button data-a="tab" data-v="${t[0]}" aria-current="${S.tab===t[0]}">${t[1]}</button>`).join("")}</div>`;
 if(S.tab==="record")return head+record(c)+"</div>";
 if(S.tab==="assess"){let last="";return head+`<div class="two" style="padding-bottom:60px"><div>${glyph(c,220)}<div style="margin-top:18px">${both(c)}</div><p class="mut">Answers start from the inventory. Dots show how much each lens counts a criterion. The glyph redraws as you change answers.</p></div><div><div class="mono" style="display:flex;justify-content:flex-end;gap:14px"><span class="r">Researcher</span><span class="e">Ecologist</span><span style="min-width:90px"></span></div>${c.crit.map((k,i)=>{const h=k[1]!==last&&c.kind==="Material"?`<div class="sub">${GN[k[1]]}</div>`:"";last=k[1];return `${h}<div class="row"><span class="l">${k[0]}</span><span class="w r">${k[2]?"●".repeat(k[2]):"–"}</span><span class="w e">${k[3]?"●".repeat(k[3]):"–"}</span><span class="yn"><button data-a="tog" data-v="${i}" data-y="1" aria-pressed="${c.ans[i]===1}">Y</button><button data-a="tog" data-v="${i}" data-y="0" aria-pressed="${c.ans[i]===0}">N</button></span></div>`}).join("")}</div></div></div>`}
 if(S.tab==="project")return head+`<div style="padding-bottom:60px;max-width:900px">${traj(c)}</div></div>`;
 const b=bestOpt(c),f=S.form||{},A=opts(c),WL={S:"Building manager",R:"Researcher",E:"Ecologist"},ed=S.edit;
 const who=`<div class="seg" style="margin:6px 0 12px" role="group" aria-label="Acting as">${["S","R","E"].map(k=>`<button data-a="who" data-v="${k}" aria-pressed="${S.who===k}">${WL[k]}</button>`).join("")}</div>`;
 const form=ed?`<div class="lens ${S.who==="R"?"r":S.who==="E"?"e":""}" style="${S.who==="S"?"border-color:var(--fg);":""}margin:18px 0"><span class="mono">${ed==="new"?"New approach":"Edit approach"} · acting as</span>${who}<div class="fg"><label>Name<input id="f_name" value="${esc(f.name||"")}"></label><label>What it involves and what it does<textarea id="f_fx" rows="2">${esc(f.fx||"")}</textarea></label><label>Researcher score (%)<input id="f_v" type="number" min="0" max="100" value="${f.v}"></label><label>Ecologist score (%)<input id="f_e" type="number" min="0" max="100" value="${f.e}"></label><label>Researcher comment<textarea id="f_rc" rows="2">${esc(f.rc||"")}</textarea></label><label>Ecologist comment<textarea id="f_ec" rows="2">${esc(f.ec||"")}</textarea></label></div><div style="display:flex;gap:10px"><button class="btn p" data-a="saveopt">Save approach</button><button class="btn" data-a="cancel">Cancel</button></div></div>`:"";
 return head+`<div style="padding-bottom:60px"><div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end"><p class="mut" style="max-width:640px;margin:0">Approaches start from a rule of thumb and can be changed by anyone: the building manager, the researcher or the ecologist. Choose who you are acting as, then add or edit an approach with a score and comment from each lens. The lower lens score counts; under 45% in either lens is vetoed.</p><button class="btn p" data-a="edit" data-v="new">+ Add an approach</button></div>${form}${c.rm.length?`<p style="margin:14px 0 0"><button class="chip" data-a="restore">Restore ${c.rm.length} removed</button></p>`:""}<div class="opt h mono" style="margin-top:18px"><span>Approach</span><span class="r">Researcher</span><span class="e">Ecologist</span><span>Lower</span><span>Effect and each lens</span></div>${A.map(s=>{const m=Math.min(s[1],s[2]),ve=m<45,rc=s===b;return `<div class="opt ${rc?"rec2":ve?"veto":""}"><span><b style="font-weight:500">${esc(s[0])}</b>${rc?'<span class="tag">Recommended</span>':""}${ve?'<span class="tag" style="color:var(--bad)">Vetoed</span>':""}${s[7]?`<span class="tag" style="color:${RC[s[7]]}">${s[6][0]==="a"?"Added":"Edited"} by ${ROLE[s[7]].toLowerCase()}</span>`:""}</span><span class="r">${s[1]}%</span><span class="e">${s[2]}%</span><span>${m}%</span><span>${s[3]?`<span class="mut" style="display:block;margin-bottom:4px">${esc(s[3])}</span>`:""}<span class="cm r">${esc(s[4])}</span><span class="cm e">${esc(s[5])}</span><span class="acts"><button data-a="edit" data-v="${s[6]}">Edit</button><button data-a="rm" data-v="${s[6]}">Remove</button><button data-a="logapp" data-v="${s[6]}" data-by="S">Log as manager</button><button data-a="logapp" data-v="${s[6]}" data-by="R">Log as researcher</button><button data-a="logapp" data-v="${s[6]}" data-by="E">Log as ecologist</button></span></span></div>`}).join("")}${A.length?"":'<p class="mut">No approaches yet. Add one.</p>'}</div></div>`},
node(){const c=C(),N=nodes(c),o=N[S.nodeI]||N[0],T={int:"▲ Intervention",rel:"⬡ Relation",opt:"○ Possible next step"},recs=N.map((n,i)=>[n,i]).filter(x=>x[0].k==="int"),pos=recs.findIndex(x=>x[1]===S.nodeI),pv=recs[pos-1],nx=recs[pos+1];
 const who=o.k==="int"?`<span class="who" style="color:${RC[o.by]}">${ROLE[o.by]}</span>`:"";
 return `<div class="wrap"><div class="crumb mono"><button data-a="go" data-p="index">Index</button> / <button data-a="back">${esc(nm(c))}</button> / ${esc(o.t)}</div><div class="mh"><div><span class="mono mut">${T[o.k]}</span><h1 style="margin-top:6px">${esc(o.t)}</h1></div><div>${who} <span class="mono mut" style="margin-left:8px">${esc(o.s)}</span></div></div><div class="tabs"></div>
 <div class="two" style="padding-bottom:40px"><div><p style="font-size:17px;margin:0 0 22px">${esc(o.p)}</p>${o.rec?effLine(c,o.rec):""}${o.k==="int"&&o.rec?`<div class="photo" style="position:static;transform:none;max-width:320px;margin-bottom:22px"><canvas data-art="${S.i}" width="72" height="40" aria-label="Placeholder evidence image"></canvas></div><p class="mono mut">Photo evidence · placeholder</p>`:""}
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn" data-a="back">← Back to diagram</button>${pv?`<button class="btn" data-a="node" data-v="${pv[1]}">← Earlier record</button>`:""}${nx?`<button class="btn" data-a="node" data-v="${nx[1]}">Later record →</button>`:""}${o.k==="rel"&&o.lk>=0?`<button class="btn" data-a="open" data-v="${o.lk}">Open ${esc(nm(COMP[o.lk]))}</button>`:""}</div>
 ${o.k==="opt"?`<p class="mut" style="margin-top:22px">Log this as work done, and it becomes a dated record on the diagram.</p><div style="display:flex;gap:10px"><button class="btn p" data-a="logopt" data-by="S">Log as manager</button><button class="btn p" data-a="logopt" data-by="R">Log as researcher</button><button class="btn p" data-a="logopt" data-by="E">Log as ecologist</button></div>`:""}</div>
 <div>${lens("R",o.r,"Researcher view")}${lens("E",o.e,"Ecologist view")}${o.k==="int"&&o.by!=="S"?`<p class="mut">Recorded by the ${ROLE[o.by].toLowerCase()}. The other lens is shown for contrast.</p>`:""}</div></div></div>`}
};
function record(c){const N=nodes(c),img=c.docs.find(d=>d.img),op=(k,d)=>(S.ac[k]??d)?"open":"",t=ticks(c),f=formula(c);
 const warn=c.printed!=null&&c.printed!==c.rec?`<p style="margin:8px 0 0"><span class="bad">Corrected:</span> the printed manual says ${c.printed}%; the stated formula gives ${c.rec}%.</p>`:"";
 return `<div class="rec"><div><div class="stage">${spider(c)}<div id="tip" class="tip" hidden></div><div class="key mono"><span><span class="r">▲</span> <span class="e">▲</span> intervention · size = score change</span><span>⬡ relation</span><span>○ possible</span></div></div><div style="margin-top:22px"><div class="mono mut" style="margin-bottom:8px">Record history · score after each record</div>${traj(c,false)}</div></div>
 <div class="deck"><div class="photo">${img?`<img src="${img.url}" alt="${esc(img.name)}">`:`<canvas data-art="${S.i}" width="72" height="50" aria-label="Placeholder image"></canvas>`}</div>
 <div class="panel"><div class="ph"><span class="mono"><i class="dot"></i> Index</span><button data-a="go" data-p="index" aria-label="Back to index">←</button></div><div class="pn"><span class="mono">● ${c.layer} · ${c.id}</span><h3>${esc(nm(c))}</h3><p>Hover a point on the diagram for its date and author. Click it to open its page.</p></div>${both(c)}
 <div class="add"><input id="note" placeholder="Log an intervention" value="${esc(S.note)}" aria-label="Log an intervention"><button data-a="add" data-by="S">As manager</button><button data-a="add" data-by="R">As researcher</button><button data-a="add" data-by="E">As ecologist</button></div>
 <details data-k="d" ${op("d",false)}><summary>Details</summary><div><dl class="dl"><dt>CRS (stated formula)</dt><dd>${c.rec==null?"—":c.rec+"%"}</dd><dt>Reuse</dt><dd>${c.reuse}</dd><dt>Disassembly</dt><dd>${c.dis}${DIS[c.dis]?" · "+DIS[c.dis]:""}</dd><dt>Criteria met</dt><dd>${nt(c)} of ${c.ans.length}</dd></dl>${warn}</div></details>
 <details data-k="l" ${op("l",true)}><summary>Records</summary><div>${N.map((n,i)=>n.k==="opt"?"":`<button class="doc" style="background:none;border:0;border-top:1px solid #e2e1da;width:100%;text-align:left;color:#111" data-a="node" data-v="${i}"><i style="color:${n.k==="rel"?"#111":RC[n.by].replace("var(--R)","#1f5fd0").replace("var(--E)","#12864a").replace("var(--fg)","#111")}">${n.k==="rel"?"⬡":"▲"}</i><span>${esc(n.t)}<br><span class="mut">${esc(n.s)}</span></span></button>`).join("")}</div></details>
 <details data-k="r" ${op("r",false)}><summary>Further reading</summary><div><div class="doc"><i>XLS</i><span>Inventory record · 18 criteria<br><span class="mut">Maintenance manual, inventory</span></span></div><div class="doc"><i>FORM</i><span>Existing material record<br><span class="mut">Logbook form, per layer</span></span></div>${c.docs.map(d=>`<div class="doc"><i>${d.img?"IMG":"FILE"}</i><a href="${d.url}" target="_blank" rel="noopener">${esc(d.name)}</a></div>`).join("")}<label class="btn" style="display:inline-block;margin-top:10px;color:#111;border-color:#111;cursor:pointer">Add image or file<input id="file" type="file" hidden></label><p class="mut" style="margin:8px 0 0">Kept in this session only.</p></div></details></div></div></div>`}
function cardModal(){const c=C(),L=LC[c.layer],v=sc(c,"R"),e=sc(c,"E"),n=COMP.indexOf(c)+1;
 return `<div class="ov" data-a="close"><div class="cwrap"><div class="tiltbox" style="--ink:${L.ink}" data-a="stop"><div class="flip" data-a="flip"><div class="face"><div class="ed mono"><span>Material identity</span><span>${c.id}</span></div><div class="art"><canvas data-art="${S.i}" width="72" height="76"></canvas><div class="gl">${glyph(c,62)}</div></div><h3>${esc(c.name.replace(" (demo planting)",""))}</h3><p>${c.layer} layer. Recorded at ${c.rec==null?"n/a":c.rec+"%"} CRS, ${nt(c)} of ${c.ans.length} criteria met. ${c.reuse!=="—"?c.reuse+", disassembly "+c.dis+".":"A living component."}</p><div class="cs"><div><span class="mono">Researcher</span><b>${v}%</b></div><div><span class="mono">Ecologist</span><b>${e}%</b></div><div><span class="mono">Disassembly</span><b>${c.dis}</b></div></div><div class="ed mono"><span>${String(n).padStart(3,"0")} de ${COMP.length}</span><span>Gosford Library</span></div><span class="vert">records of repair</span><div class="holo"></div></div>
 <div class="face back"><div class="ed mono"><span>Criteria met</span><span>${c.id}</span></div><div style="display:grid;place-items:center;margin:14px 0">${glyph(c,150)}</div><div class="leg">${c.crit.map((k,i)=>`<span>${c.ans[i]?"■":"□"} ${esc(k[0].slice(0,24))}</span>`).join("")}</div><div class="holo"></div></div></div></div><span class="mono">Tap card to flip · move to tilt</span><button class="btn" data-a="close">Close</button></div></div>`}

function render(){
 $("#nav").innerHTML=`<button class="brand" data-a="go" data-p="start"><i class="dot"></i>Records of Repair</button><div class="links">${[["start","Start"],["index","Index"],["portfolio","Portfolio"],["method","Method"]].map(p=>`<button class="l" data-a="go" data-p="${p[0]}" aria-current="${S.page===p[0]}">${p[1]}</button>`).join("")}</div>`;
 $("#page").innerHTML=`<div class="${S.anim?"anim":""}">${PG[S.page]()}</div>`;
 $("#modal").innerHTML=S.card?cardModal():"";
 document.querySelectorAll("canvas[data-art]").forEach(paint);document.querySelectorAll(".stage").forEach(s=>{s.scrollLeft=(s.scrollWidth-s.clientWidth)/2});S.anim=false}
const nav=(p,x)=>{S.edit=null;S.page=p;S.anim=true;S.card=false;if(x)Object.assign(S,x);window.scrollTo(0,0)};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v,c=C();
 if(a==="flip"){b.classList.toggle("b");return}if(a==="stop")return;
 if(a==="close"){if(b.classList.contains("ov")&&e.target.closest(".tiltbox"))return;S.card=false}
 else if(a==="go")nav(b.dataset.p);
 else if(a==="open")nav("mat",{i:+v,tab:"record"});
 else if(a==="rec"){const cc=COMP[+v];nav("node",{i:+v,nodeI:Math.max(0,nodes(cc).findIndex(n=>n.rec===cc.log[+b.dataset.j]))})}
 else if(a==="node")nav("node",{nodeI:+v});
 else if(a==="back")nav("mat",{tab:"record"});
 else if(a==="tab"){S.tab=v;S.edit=null;S.anim=true}
 else if(a==="who")S.who=v;
 else if(a==="edit"){S.edit=v;const o=v==="new"?null:opts(c).find(x=>x[6]===v);S.form=o?{name:o[0],v:o[1],e:o[2],fx:o[3],rc:o[4],ec:o[5]}:{name:"",v:60,e:60,fx:"",rc:"",ec:""}}
 else if(a==="cancel")S.edit=null;
 else if(a==="saveopt"){const f=S.form,n0=(f.name||"").trim();if(!n0)return;const cl=n=>Math.max(0,Math.min(100,Math.round(+n)||0)),x={name:n0,v:cl(f.v),e:cl(f.e),fx:f.fx||"",rc:f.rc||"No comment recorded.",ec:f.ec||"No comment recorded.",by:S.who};if(S.edit==="new")c.added.push({...x,id:"a"+Date.now()});else if(S.edit[0]==="a")c.added=c.added.map(y=>y.id===S.edit?{...x,id:y.id}:y);else c.ov[S.edit]=x;S.edit=null}
 else if(a==="rm"){if(v[0]==="a")c.added=c.added.filter(y=>y.id!==v);else c.rm.push(v)}
 else if(a==="restore")c.rm=[];
 else if(a==="logapp"){const o=opts(c).find(x=>x[6]===v);if(!o)return;c.log.unshift({t:TODAY,by:b.dataset.by,title:o[0].slice(0,34),text:o[0]+". "+o[3]});nav("mat",{tab:"record"})}
 else if(a==="layer")S.layer=v;
 else if(a==="card")S.card=true;
 else if(a==="tog")c.ans[+v]=+b.dataset.y;
 else if(a==="add"||a==="logopt"){let t,ti;if(a==="add"){t=S.note.trim();if(!t)return;ti=t.slice(0,34)}else{const o=nodes(c)[S.nodeI];t=o.p;ti=o.t}c.log.unshift({t:TODAY,by:b.dataset.by,title:ti,text:t});S.note="";nav("mat",{tab:"record"})}
 render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.card){S.card=false;render()}if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.a==="node"){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
document.addEventListener("input",e=>{if(e.target.id==="note")S.note=e.target.value;if(e.target.id&&e.target.id.startsWith("f_")&&S.form)S.form[e.target.id.slice(2)]=e.target.value});
document.addEventListener("change",e=>{if(e.target.id==="rate"){S.rate=+e.target.value;render()}if(e.target.id==="file"&&e.target.files[0]){const f=e.target.files[0];C().docs.push({name:f.name,url:URL.createObjectURL(f),img:f.type.startsWith("image/")});S.ac.r=true;render()}});
document.addEventListener("toggle",e=>{if(e.target.dataset&&e.target.dataset.k)S.ac[e.target.dataset.k]=e.target.open},true);
document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest(".tiltbox");if(t){const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;t.style.setProperty("--mx",x);t.style.setProperty("--my",y);t.style.transform=`rotateY(${((x-.5)*20).toFixed(1)}deg) rotateX(${(-(y-.5)*20).toFixed(1)}deg)`}
 const n=e.target.closest&&e.target.closest(".nd[data-v]");if(!n){document.querySelectorAll(".tip").forEach(z=>z.hidden=true);return}
 const box=n.closest(".stage,.chartbox"),tp=box&&box.querySelector(".tip");if(!tp)return;
 const o=nodes(C())[+n.dataset.v],st=box.getBoundingClientRect();
 tp.innerHTML=`<b>${esc(o.t)}</b>${o.k==="int"?`${esc(o.s)}`:o.k==="rel"?"Relation · click to open":"Possible next step · click to open"}${o.k==="int"&&o.by!=="S"?`<br><span style="color:${o.by==="R"?"#1f5fd0":"#12864a"}">Recorded by the ${ROLE[o.by].toLowerCase()}</span>`:""}`;if(n.dataset.x)tp.innerHTML+=`<br>${esc(n.dataset.x)}`;tp.hidden=false;
 tp.style.left=Math.min(e.clientX-st.left+14,st.width-240)+"px";tp.style.top=(e.clientY-st.top+14)+"px"});
document.addEventListener("pointerleave",e=>{const t=e.target.closest&&e.target.closest(".tiltbox");if(t)t.style.transform=""},true);
render();

</script>
